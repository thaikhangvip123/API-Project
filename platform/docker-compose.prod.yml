name: internship-api-platform-prod

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - platform-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  auth-service:
    image: ghcr.io/your-org/auth-service:0.1.0
    env_file: .env
    expose:
      - "3000"
    networks:
      - platform-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  user-service:
    image: ghcr.io/your-org/user-service:0.1.0
    env_file: .env
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  graphql-service:
    image: ghcr.io/your-org/graphql-service:0.1.0
    env_file: .env
    expose:
      - "4000"
    depends_on:
      - user-service
      - grpc-service
    networks:
      - platform-net
    restart: unless-stopped

  grpc-service:
    image: ghcr.io/your-org/grpc-service:0.1.0
    env_file: .env
    expose:
      - "50051"
    depends_on:
      - user-service
    networks:
      - platform-net
    restart: unless-stopped

  websocket-service:
    image: ghcr.io/your-org/websocket-service:0.1.0
    env_file: .env
    expose:
      - "3000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - platform-net
    restart: unless-stopped

  webhook-service:
    image: ghcr.io/your-org/webhook-service:0.1.0
    env_file: .env
    expose:
      - "3000"
    networks:
      - platform-net
    restart: unless-stopped

  soap-service:
    image: ghcr.io/your-org/soap-service:0.1.0
    env_file: .env
    expose:
      - "8000"
    networks:
      - platform-net
    restart: unless-stopped

  webrtc-signaling:
    image: ghcr.io/your-org/webrtc-signaling:0.1.0
    env_file: .env
    expose:
      - "3000"
    networks:
      - platform-net
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - platform-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  platform-net:
    driver: bridge

volumes:
  pgdata:
