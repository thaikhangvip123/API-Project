<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Platform Chat</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, serif; background: #efe9dc; color: #18201d; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top left, #fff8e8, transparent 45%), #c9d8cb; }
      main { width: min(760px, 100%); min-height: 620px; display: grid; grid-template-rows: auto 1fr auto; background: #fffdf7; border: 2px solid #18201d; box-shadow: 12px 12px 0 #486858; }
      header { padding: 22px 26px; border-bottom: 2px solid #18201d; display: flex; justify-content: space-between; gap: 16px; align-items: end; }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); letter-spacing: -0.04em; }
      #status { font-family: monospace; font-size: 13px; }
      #messages { list-style: none; margin: 0; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
      #messages li { padding: 12px 14px; background: #f0eadc; border-left: 5px solid #d56945; }
      #messages strong { display: block; margin-bottom: 4px; }
      form { padding: 20px 24px; border-top: 2px solid #18201d; display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; }
      input, button { min-height: 44px; border: 2px solid #18201d; padding: 10px 12px; font: inherit; }
      button { background: #d56945; color: #fff; font-weight: bold; cursor: pointer; }
      @media (max-width: 640px) { main { min-height: 80vh; } form { grid-template-columns: 1fr; } header { align-items: start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <header><h1>Platform Chat</h1><span id="status">connecting...</span></header>
      <ul id="messages" aria-live="polite"></ul>
      <form id="chat-form">
        <input id="username" maxlength="40" value="intern" aria-label="Username">
        <input id="message" maxlength="1000" autocomplete="off" placeholder="Write a message" aria-label="Message" required>
        <button type="submit">Send</button>
      </form>
    </main>
    <script src="socket.io/socket.io.js"></script>
    <script>
      const prefix = window.location.pathname.startsWith('/ws') ? '/ws' : '';
      const usernameInput = document.querySelector('#username');
      const messageInput = document.querySelector('#message');
      const messages = document.querySelector('#messages');
      const status = document.querySelector('#status');
      const socket = io({ path: `${prefix}/socket.io`, auth: (callback) => callback({ username: usernameInput.value }) });

      function renderMessage(message) {
        const item = document.createElement('li');
        const author = document.createElement('strong');
        const text = document.createElement('span');
        author.textContent = message.username;
        text.textContent = message.text;
        item.append(author, text);
        messages.append(item);
        messages.scrollTop = messages.scrollHeight;
      }

      socket.on('connect', () => { status.textContent = 'connected'; });
      socket.on('disconnect', () => { status.textContent = 'reconnecting...'; });
      socket.io.on('reconnect_attempt', () => { status.textContent = 'reconnecting...'; });
      socket.on('chat:presence', ({ connectedClients }) => { status.textContent = `connected - ${connectedClients} online`; });
      socket.on('chat:history', (history) => { messages.replaceChildren(); history.forEach(renderMessage); });
      socket.on('chat:message', renderMessage);

      document.querySelector('#chat-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const username = usernameInput.value;
        const message = messageInput.value;
        socket.emit('chat:username', username, (usernameResult) => {
          if (!usernameResult.ok) {
            status.textContent = usernameResult.error;
            return;
          }
          socket.emit('chat:message', message, (messageResult) => {
            if (messageResult.ok) {
              if (messageInput.value === message) {
                messageInput.value = '';
              }
            } else {
              status.textContent = messageResult.error;
            }
          });
        });
      });
    </script>
  </body>
</html>
